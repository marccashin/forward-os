# Runs on every pull request to main or staging.
#
# Why: index.html is one large file holding the whole app. A name used in the
# template but not returned from setup() blanks production; it has happened
# five times. These checks used to live in a session's scratch folder and ran
# only if that session remembered. Now GitHub runs them on every PR.
#
# What runs:
#   ci/static-checks.js  scripts parse, template compiles, every template name
#                        is returned and declared, file did not shrink,
#                        CHANGELOG is well formed.
#   ci/mount-check.js    opens the real app in headless Chromium, logged out
#                        and as every login, opens every view. Never touches
#                        production: all network calls are intercepted.
#   ci/offers-test.js    Offer Tracker against a made-up buyer_offers table:
#                        failed saves are shown, retries never duplicate, a
#                        removed offer never comes back.
#   ci/save-failure-test.js  runs each save with the cloud working and with
#                        every write failing: a success message only when it
#                        saved, a plain failure message when it did not.
#   ci/meeting-prep-test.js  a brief says when online research did not run,
#                        and slow research is not thrown away.
#   ci/ai-key-test.js    the sign-in AI key check: no notice when a key is
#                        there, a red notice on every screen when it is not,
#                        and no tool ever shows made-up demo output.
#   ci/cma-builder-test.js  the CMA Builder: the newest saved CMA for a listing
#                        opens and an empty one never hides a full one, orange
#                        boxes clear once reviewed and the count matches them,
#                        and Back to Listing returns to the listing.
#   ci/dashboard-rows-test.js  a row under Active Listings or Buyer Pipeline on
#                        the Dashboard opens that listing or that buyer.
#   ci/mine-first-test.js  the signed-in agent's own deals first on My Listings,
#                        Buyer Package and the Dashboard; every deal still shown;
#                        the arrow on an agent's group folds only that group.
#   ci/deal-progress-test.js  the Deal Progress tab: the right Command Center
#                        and Open To Close records, who and when, an agent tick
#                        writes only that agent row with the agent's name.
#   ci/listing-presentation-test.js  every agent downloads only their own
#                        listing presentation, as a PDF from the backend; no
#                        Canva link is left; Operations and Concierge get none.
#   ci/net-sheet-listing-test.js  every listing opens its own net sheet: a
#                        panel left open on one listing never shows on the
#                        next, and the form fills from that listing's MLS Data.
#   ci/seller-prep-listing-test.js  every listing opens its own Seller Prep
#                        checklist: what one listing removed or added never
#                        shows on another; a saved checklist reopens exactly.
#   ci/note-history-test.js  a listing shows when and by whom its net sheet, CMA
#                        and description were saved, and every earlier version.
#   ci/net-sheet-numbers-test.js  the seller net sheet's numbers: two executed
#                        settlement statements to the penny, 116 recorded sheets
#                        across all 28 jurisdictions, and one calculator.
#   ci/net-sheet-pdf-test.js  the seller net sheet PDF: every calculated line in
#                        its group (charges, credits, summary) to the penny on
#                        all 116 recorded sheets, the net in the navy bar is the
#                        calculator's, and nothing runs off the page.
#   ci/description-approval-test.js  Approve for marketing: "Approved" only for
#                        an approval the database confirmed, a changed description
#                        says its approval was cleared, a failed write or a failed
#                        message to Concierge is shown, and the message is the
#                        agreed JSON.
#   ci/description-editing-test.js  the writer's "editing now" marker: written
#                        when the writer opens on a listing with a saved
#                        description, refreshed each minute while the tab is
#                        visible, removed on save, leave, listing switch and tab
#                        close, and never shown to the agent when it fails.
#   ci/description-approval-db-test.js  the same rule in a real Postgres: the
#                        repo's SQL, run as the app's own database role. Also the
#                        editing marker's table and functions.
#   ci/meeting-briefs-test.js  saved Meeting Prep briefs on a card: they say they
#                        open, Move to another card and Remove send one call with
#                        the signed-in agent and show only what the database
#                        confirmed, and a card holds a brief for each person.
#   ci/meeting-briefs-db-test.js  moving and removing briefs in a real Postgres:
#                        the repo's SQL, additive only, the app still cannot change
#                        a brief directly, every refusal changes nothing.
#
# Both compare the PR against its base branch. Parity is the signal: problems
# main already has do not fail a PR, new ones do.
#
# To allow an intended large removal, add the label "allow-shrink" to the PR.
#
# Speed (Marc, Oct 24, 2026: "20 minutes for each update is too long"). Every test
# still runs on every PR; nothing is skipped by what a PR touches, because the whole
# app is one file and a slip anywhere can blank every screen. The tests run in four
# groups at the same time instead of one after another (about 16 minutes in a row in
# the run of Oct 24), each group about 4 minutes. The install is cached between runs.
# The last job, "App loads and names line up", is the one the main branch rule
# requires: it passes only when every group passed. Keep that name.
# A new test goes into the lightest group in the case statement below.
name: PR checks

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  group:
    name: Checks, group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same versions as before. Change the key with the versions.
      - name: Restore check tools from the cache
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tools
            ~/.cache/ms-playwright
          key: check-tools-${{ runner.os }}-vue3.4.21-parse5.7-acorn8-jspdf2.5.1-playwright1.56.0-v1

      # Installed outside both checkouts. Never npm install inside the repo.
      - name: Install check tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          if [ "${{ steps.tools-cache.outputs.cache-hit }}" != "true" ]; then
            npm init -y >/dev/null
            npm install --no-audit --no-fund \
              @vue/compiler-dom@3.4.21 vue@3.4.21 parse5@7 acorn@8 acorn-walk@8 jspdf@2.5.1 playwright@1.56.0
            npx playwright install chromium
          fi
          npx playwright install-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/tools/node_modules" >> "$GITHUB_ENV"

      # Every test in the group runs even when an earlier one fails, and each one's
      # output is folded under its own heading. The group fails if any test failed.
      - name: Run the tests in this group
        env:
          ALLOW_SHRINK: ${{ contains(github.event.pull_request.labels.*.name, 'allow-shrink') && '1' || '0' }}
        run: |
          failed=""
          t() {
            label="$1"; shift
            echo "::group::$label"
            start=$(date +%s)
            if "$@"; then r=ok; else r=FAILED; failed="$failed
            - $label"; fi
            echo "::endgroup::"
            echo "$r  $label ($(( $(date +%s) - start ))s)"
          }
          case "${{ matrix.group }}" in
            1)
              t "Approve for marketing test (approved only when the database says so, failures shown)" node head/ci/description-approval-test.js head
              t "Editing marker test (writer open marks the listing, refreshes while visible, clears on save or leave)" node head/ci/description-editing-test.js head
              ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y postgresql)
              t "Approve for marketing database test (the repo's SQL in a throwaway Postgres)" node head/ci/description-approval-db-test.js head
              t "Meeting briefs test (open, move to the right card, remove, one per person)" node head/ci/meeting-briefs-test.js head
              t "Meeting briefs database test (the repo's SQL in a throwaway Postgres)" node head/ci/meeting-briefs-db-test.js head
              t "AI key test (notice when the key is missing, no demo output anywhere)" node head/ci/ai-key-test.js head
              ;;
            2)
              t "Listing presentation test (each agent downloads only their own deck)" node head/ci/listing-presentation-test.js head
              t "Offer Tracker test (saves, retries, removed offers, moving old offers)" node head/ci/offers-test.js head
              t "Meeting Prep test (says when research did not run, uses slow research)" node head/ci/meeting-prep-test.js head
              t "Save failure test (never says saved when it did not save)" node head/ci/save-failure-test.js head
              t "Mine first test (your own deals on top, every deal still there, group arrows fold)" node head/ci/mine-first-test.js head
              t "Cash to Close test (a cash purchase counts the whole price, 0% down allowed)" node head/ci/cash-to-close-test.js head
              t "MLS Data test (shorthand prices, five figures open the tools, address saves tell the truth)" node head/ci/mls-data-test.js head
              ;;
            3)
              t "CMA Builder test (newest saved CMA opens, review highlights, Back to Listing)" node head/ci/cma-builder-test.js head
              t "Net sheet per listing test (no card shows another card's net sheet)" node head/ci/net-sheet-listing-test.js head
              t "Seller Prep per listing test (no listing shows another listing's checklist)" node head/ci/seller-prep-listing-test.js head
              t "Dashboard rows test (a row opens that listing or that buyer)" node head/ci/dashboard-rows-test.js head
              t "Deal Progress test (who did what on a listing; agent ticks)" node head/ci/deal-progress-test.js head
              t "Version history test (every earlier save of a listing item can be opened)" node head/ci/note-history-test.js head
              t "Net sheet numbers test (executed statements to the penny, every jurisdiction)" node head/ci/net-sheet-numbers-test.js head
              t "Net sheet PDF test (charges, credits and summary say what the calculator said)" node head/ci/net-sheet-pdf-test.js head
              ;;
            4)
              t "Static checks" node head/ci/static-checks.js head base
              t "Mount check (real browser, every login, every view)" node head/ci/mount-check.js head base
              t "Buyer Avatars test (own tool on the listing, saved note, campaign and writer read it)" node head/ci/buyer-avatars-test.js head
              t "Campaign headline test (the Listing Description headline is never cut, no copy is dropped)" node head/ci/campaign-headline-test.js head
              t "Campaign avatars test (revised buyer avatars print as separate cards, nothing cut)" node head/ci/campaign-avatars-test.js head
              t "Campaign editor test (one Seller Prep card, typing and clicking never move the panel)" node head/ci/campaign-editor-test.js head
              ;;
          esac
          if [ -n "$failed" ]; then
            echo "Failed in group ${{ matrix.group }}:$failed"
            exit 1
          fi

  # The check the main branch rule requires. Passes only when every group passed.
  checks:
    name: App loads and names line up
    needs: group
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every group passed
        run: |
          echo "Groups: ${{ needs.group.result }}"
          test "${{ needs.group.result }}" = "success"
